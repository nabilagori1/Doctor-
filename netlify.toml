# Netlify Configuration for Sai Shradhdha Mind Care Clinic
# Vite React Single Page Application (SPA)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_SUPABASE_URL = "https://pbivgyyylvgupudempjp.supabase.co"
  VITE_SUPABASE_ANON_KEY = "sb_publishable_GHjIsado2stkeAF3GXkgHA_D5U4tyyv"

# Single Page App (SPA) redirect rule:
# Ensures all route requests (e.g. /admin, /booking, /services) rewrite to index.html with HTTP status 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security, Caching, and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
